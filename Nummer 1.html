<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Disc//Tracker">
<link rel="apple-touch-icon" href="app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="app-icon-512.png">
<title>DISC//TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090C;
    --bg-panel:#0E1015;
    --bg-panel2:#14171E;
    --bg-inset:#0A0C10;
    --line:#1E222B;
    --line-bright:#2A303C;
    --text:#E4E7EC;
    --text-dim:#767C8A;
    --text-faint:#3E4350;
    --ok:#00E5A0;
    --ok-dim:#0A2E24;
    --bad:#FF3B5C;
    --bad-dim:#331019;
    --warn:#FFB020;
    --warn-dim:#332608;
    --accent:#3B82F6;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    --sans:'Inter', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); padding-bottom:96px;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(59,130,246,0.05), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(0,229,160,0.04), transparent 40%);
  }
  ::selection{background:var(--ok); color:#000;}

  .ticker{
    background:var(--bg-panel); border-bottom:1px solid var(--line);
    overflow:hidden; white-space:nowrap; padding:7px 0;
    font-family:var(--mono); font-size:11px;
  }
  .ticker-inner{display:inline-flex; animation:scroll 22s linear infinite;}
  .ticker-inner span{padding:0 18px; color:var(--text-dim); border-right:1px solid var(--line-bright);}
  .ticker-inner span b{color:var(--ok); font-weight:700;}
  .ticker-inner span.neg b{color:var(--bad);}
  @keyframes scroll{ 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

  header{
    padding:18px 16px 14px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:30px; height:30px; border:1.5px solid var(--ok); border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:13px; font-weight:800; color:var(--ok);
  }
  .brand-text .t1{font-family:var(--mono); font-size:14px; font-weight:700; letter-spacing:0.02em;}
  .brand-text .t2{font-family:var(--mono); font-size:9px; color:var(--text-faint); letter-spacing:0.14em; text-transform:uppercase; margin-top:1px;}
  .status-dot{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; color:var(--text-dim);}
  .status-dot i{width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px var(--ok); display:inline-block; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.4;}}

  .panel{
    margin:14px 16px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:10px; position:relative; overflow:hidden;
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 14px; border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim);
  }
  .panel-head .tag{color:var(--text-faint); font-size:9px;}
  .panel-body{padding:16px 14px;}

  .top-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px;}
  .gauge-card{background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:16px 14px; text-align:center;}
  .gauge-wrap{position:relative; width:110px; height:110px; margin:4px auto 6px;}
  .gauge-val{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-val .n{font-family:var(--mono); font-size:24px; font-weight:800;}
  .gauge-val .u{font-family:var(--mono); font-size:9px; color:var(--text-faint); margin-top:1px;}
  .gauge-label{font-family:var(--mono); font-size:9px; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase;}

  .streak-card{background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:16px 14px; display:flex; flex-direction:column; justify-content:center; align-items:center;}
  .streak-num{font-family:var(--mono); font-size:36px; font-weight:800; color:var(--ok); line-height:1;}
  .streak-num.zero{color:var(--bad);}
  .streak-sub{font-family:var(--mono); font-size:9px; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase; margin-top:6px;}
  .streak-best{font-family:var(--mono); font-size:10px; color:var(--text-faint); margin-top:10px;}
  .streak-best b{color:var(--text-dim);}

  .heatmap{display:flex; gap:3px; overflow-x:auto; padding-bottom:4px;}
  .heat-col{display:flex; flex-direction:column; gap:3px;}
  .heat-cell{width:12px; height:12px; border-radius:3px; background:var(--bg-inset); border:1px solid var(--line);}
  .heat-cell.d-ok{background:var(--ok); border-color:var(--ok);}
  .heat-cell.d-bad{background:var(--bad); border-color:var(--bad);}
  .heat-cell.d-partial{background:var(--warn); border-color:var(--warn);}
  .heat-legend{display:flex; align-items:center; gap:6px; margin-top:10px; font-family:var(--mono); font-size:9px; color:var(--text-faint);}
  .heat-legend .heat-cell{width:9px; height:9px;}

  .check-list{display:flex; flex-direction:column; gap:7px;}
  .check-row{display:flex; align-items:center; gap:11px; background:var(--bg-inset); border:1px solid var(--line); border-radius:8px; padding:12px 13px; cursor:pointer; transition:border-color .15s;}
  .check-row.checked{border-color:var(--ok);}
  .box{width:16px; height:16px; border-radius:4px; border:1.5px solid var(--text-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent; font-weight:800;}
  .check-row.checked .box{background:var(--ok); border-color:var(--ok); color:#000;}
  .check-row span.rt{font-size:13.5px; font-family:var(--sans);}

  .field-row{display:flex; gap:8px; margin-bottom:10px;}
  .field-row > div{flex:1;}
  label.small{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); display:block; margin-bottom:6px; letter-spacing:0.06em; text-transform:uppercase;}
  input[type=text], input[type=number], textarea, select{
    background:var(--bg-inset); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:11px 12px; font-size:14px; width:100%; font-family:var(--sans);
  }
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--ok);}
  .btn{background:var(--ok); color:#03130D; border:none; border-radius:8px; padding:13px 18px; font-weight:700; font-size:13.5px; font-family:var(--mono); letter-spacing:0.03em; text-transform:uppercase;}
  .btn.ghost{background:var(--bg-inset); color:var(--text-dim); border:1px solid var(--line);}
  .btn.full{width:100%;}

  .rule-item{display:flex; align-items:center; justify-content:space-between; background:var(--bg-inset); border:1px solid var(--line); border-radius:8px; padding:12px 13px; margin-bottom:7px;}
  .rule-item span{font-size:13.5px;}
  .rule-item button{background:none; border:none; color:var(--text-faint); font-size:15px; padding:2px 6px;}
  .add-rule{display:flex; gap:8px; margin-top:8px;}
  .add-rule input{flex:1;}

  .vbar-row{margin-bottom:12px;}
  .vbar-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;}
  .vbar-top .cnt{font-family:var(--mono); color:var(--bad); font-weight:700;}
  .vbar-track{height:6px; background:var(--bg-inset); border-radius:4px; overflow:hidden;}
  .vbar-fill{height:100%; background:linear-gradient(90deg, var(--bad), #ff7a92); border-radius:4px;}

  .xtab{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .xtab-cell{background:var(--bg-inset); border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center;}
  .xtab-cell .n{font-family:var(--mono); font-size:20px; font-weight:800;}
  .xtab-cell .l{font-family:var(--mono); font-size:8.5px; color:var(--text-faint); letter-spacing:0.06em; text-transform:uppercase; margin-top:4px; line-height:1.4;}
  .xtab-cell.c-ok .n{color:var(--ok);}
  .xtab-cell.c-bad .n{color:var(--bad);}
  .xtab-cell.c-warn .n{color:var(--warn);}

  .entry{background:var(--bg-inset); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:6px; padding:12px 13px; margin-bottom:7px;}
  .entry.e-ok{border-left-color:var(--ok);}
  .entry.e-bad{border-left-color:var(--bad);}
  .entry-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;}
  .entry-date{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .pill{font-family:var(--mono); font-size:9px; padding:3px 7px; border-radius:4px; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;}
  .pill.ok{background:var(--ok-dim); color:var(--ok);}
  .pill.bad{background:var(--bad-dim); color:var(--bad);}
  .pill.phase{background:var(--bg-panel2); color:var(--text-dim); border:1px solid var(--line);}
  .entry-violations{font-family:var(--mono); font-size:11px; color:var(--bad); margin-top:4px;}
  .entry-note{font-size:12.5px; color:var(--text-dim); margin-top:6px; font-style:italic;}
  .empty{color:var(--text-faint); font-size:12.5px; text-align:center; padding:26px 0; font-family:var(--mono);}

  nav{position:fixed; bottom:0; left:0; right:0; background:rgba(8,9,12,0.96); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; padding:6px 10px calc(6px + env(safe-area-inset-bottom));}
  nav button{flex:1; background:none; border:none; color:var(--text-faint); font-family:var(--mono); font-size:10px; padding:9px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; letter-spacing:0.04em; text-transform:uppercase; border-radius:8px;}
  nav button.active{color:var(--ok); background:var(--bg-panel2);}

  .view{display:none;}
  .view.active{display:block; animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
</style>
</head>
<body>

<div class="ticker"><div class="ticker-inner" id="tickerInner"></div></div>

<header>
  <div class="brand">
    <div class="brand-mark">D</div>
    <div class="brand-text">
      <div class="t1">DISC//TRACKER</div>
      <div class="t2" id="headerDate">—</div>
    </div>
  </div>
  <div class="status-dot"><i></i>LIVE</div>
</header>

<div class="view active" id="view-log">

  <div class="top-grid">
    <div class="gauge-card">
      <div class="gauge-label">Discipline</div>
      <div class="gauge-wrap">
        <svg width="110" height="110" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="46" fill="none" stroke="#1E222B" stroke-width="8"/>
          <circle id="gaugeArc" cx="55" cy="55" r="46" fill="none" stroke="#00E5A0" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 55 55)"/>
        </svg>
        <div class="gauge-val"><div class="n" id="gaugePct">0%</div><div class="u">RATE</div></div>
      </div>
    </div>
    <div class="streak-card">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-sub">Current Streak</div>
      <div class="streak-best">Best: <b id="bestStreak">0</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><span>Activity // Last 12 Weeks</span><span class="tag" id="heatCount">0 entries</span></div>
    <div class="panel-body">
      <div class="heatmap" id="heatmap"></div>
      <div class="heat-legend">
        <span>Weniger</span>
        <div class="heat-cell" style="background:var(--bg-inset)"></div>
        <div class="heat-cell d-partial" style="background:var(--warn)"></div>
        <div class="heat-cell d-ok" style="background:var(--ok)"></div>
        <span>Mehr diszipliniert</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><span>New Entry</span><span class="tag">MANUAL</span></div>
    <div class="panel-body">
      <div class="field-row">
        <div><label class="small">Datum</label><input type="text" id="entryDate"></div>
        <div><label class="small">Ergebnis</label>
          <select id="entryResult">
            <option value="win">Win</option>
            <option value="loss">Loss</option>
            <option value="be">Breakeven</option>
            <option value="none">Kein Trade</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div>
          <label class="small">Phase</label>
          <select id="entryPhase">
            <option value="eval1">Eval Phase 1</option>
            <option value="eval2">Eval Phase 2</option>
            <option value="funded">Funded</option>
          </select>
        </div>
      </div>
      <label class="small">Regeln eingehalten?</label>
      <div class="check-list" id="checkList"></div>
      <label class="small" style="margin-top:12px;">Notiz</label>
      <textarea id="entryNote" rows="2" placeholder="was ist passiert..."></textarea>
      <button class="btn full" style="margin-top:12px;" onclick="saveEntry()">Eintrag loggen</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><span>Log History</span><span class="tag" id="histCount">0</span></div>
    <div class="panel-body" id="historyList"></div>
  </div>
</div>

<div class="view" id="view-stats">
  <div class="panel">
    <div class="panel-head"><span>Regelverstöße nach Häufigkeit</span></div>
    <div class="panel-body" id="violationBreakdown"></div>
  </div>
  <div class="panel">
    <div class="panel-head"><span>Diszipliniert vs. Ergebnis</span></div>
    <div class="panel-body"><div class="xtab" id="crossTab"></div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><span>Phase Breakdown</span></div>
    <div class="panel-body" id="phaseBreakdown"></div>
  </div>
  <div class="panel">
    <div class="panel-head"><span>Wochentag-Breakdown</span></div>
    <div class="panel-body" id="weekdayBreakdown"></div>
  </div>
</div>

<div class="view" id="view-rules">
  <div class="panel">
    <div class="panel-head"><span>Regelkatalog</span></div>
    <div class="panel-body">
      <div id="ruleList"></div>
      <div class="add-rule">
        <input type="text" id="newRuleText" placeholder="z.B. Max 2 Trades/Tag">
        <button class="btn" onclick="addRule()">+</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><span>Daten</span></div>
    <div class="panel-body">
      <button class="btn ghost full" style="margin-bottom:8px;" onclick="exportData()">Backup exportieren (JSON)</button>
      <button class="btn ghost full" onclick="document.getElementById('importFile').click()">Backup importieren</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</div>

<nav>
  <button class="active" onclick="switchView('log', event)">LOG</button>
  <button onclick="switchView('stats', event)">STATS</button>
  <button onclick="switchView('rules', event)">RULES</button>
</nav>

<script>
const STORE_KEY = 'discipline_tracker_v2';
const WEEKDAYS_DE = ['So','Mo','Di','Mi','Do','Fr','Sa'];

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    rules: [
      {id:1, text:'Max 2 Trades pro Tag'},
      {id:2, text:'Risk = 1500€ (nicht weniger)'},
      {id:3, text:'Nur A+ Setup'},
    ],
    entries: []
  };
}
let state = loadState();
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function formatDateDE(d){ return d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear(); }
function todayDE(){ return formatDateDE(new Date()); }
function isoToDE(iso){ const [y,m,d] = iso.split('-').map(Number); return d+'. '+m+'. '+y; }
function parseDateDE(str){
  const parts = str.split('.').map(s=>s.trim()).filter(Boolean);
  if(parts.length===3){
    const day=parseInt(parts[0],10), month=parseInt(parts[1],10), year=parseInt(parts[2],10);
    if(!isNaN(day) && !isNaN(month) && !isNaN(year)){
      return year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    }
  }
  return null;
}

function switchView(name, ev){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  if(ev) ev.currentTarget.classList.add('active');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderHeaderDate(){
  const d = new Date();
  const opts = {weekday:'short', day:'2-digit', month:'short'};
  document.getElementById('headerDate').textContent = d.toLocaleDateString('de-DE', opts).toUpperCase();
}

function renderRules(){
  const list = document.getElementById('ruleList');
  list.innerHTML = '';
  state.rules.forEach(r=>{
    const div = document.createElement('div');
    div.className = 'rule-item';
    div.innerHTML = `<span>${escapeHtml(r.text)}</span><button onclick="deleteRule(${r.id})">✕</button>`;
    list.appendChild(div);
  });
}
function addRule(){
  const input = document.getElementById('newRuleText');
  const text = input.value.trim();
  if(!text) return;
  state.rules.push({id: Date.now(), text});
  input.value = '';
  saveState(); renderRules(); renderCheckList();
}
function deleteRule(id){
  state.rules = state.rules.filter(r=>r.id!==id);
  saveState(); renderRules(); renderCheckList();
}

let checkedRuleIds = new Set();
function renderCheckList(){
  checkedRuleIds = new Set(state.rules.map(r=>r.id));
  const list = document.getElementById('checkList');
  list.innerHTML = '';
  state.rules.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'check-row checked';
    row.innerHTML = `<div class="box">✓</div><span class="rt">${escapeHtml(r.text)}</span>`;
    row.onclick = ()=>{
      if(checkedRuleIds.has(r.id)){ checkedRuleIds.delete(r.id); row.classList.remove('checked'); }
      else { checkedRuleIds.add(r.id); row.classList.add('checked'); }
    };
    list.appendChild(row);
  });
}

function saveEntry(){
  const rawDate = document.getElementById('entryDate').value.trim();
  const date = parseDateDE(rawDate) || todayStr();
  const result = document.getElementById('entryResult').value;
  const phase = document.getElementById('entryPhase').value;
  const note = document.getElementById('entryNote').value.trim();
  const brokenRules = state.rules.filter(r=>!checkedRuleIds.has(r.id)).map(r=>r.text);
  const disciplined = brokenRules.length === 0;

  state.entries.unshift({ id: Date.now(), date, result, phase, note, disciplined, brokenRules });
  state.lastPhase = phase;
  saveState();
  document.getElementById('entryNote').value = '';
  document.getElementById('entryDate').value = todayDE();
  renderCheckList();
  renderAll();
}

function computeStreak(){
  let streak = 0;
  for(const e of state.entries){ if(e.disciplined) streak++; else break; }
  return streak;
}
function computeBestStreak(){
  let best=0, cur=0;
  const chron = [...state.entries].reverse();
  for(const e of chron){ if(e.disciplined){ cur++; best=Math.max(best,cur); } else cur=0; }
  return best;
}

function renderGaugeAndStreak(){
  const total = state.entries.length;
  const disciplinedCount = state.entries.filter(e=>e.disciplined).length;
  const rate = total ? Math.round(disciplinedCount/total*100) : 0;
  const circumference = 2*Math.PI*46;
  const offset = circumference - (rate/100)*circumference;
  const arc = document.getElementById('gaugeArc');
  arc.style.strokeDasharray = circumference;
  arc.style.strokeDashoffset = offset;
  arc.style.stroke = rate>=70 ? '#00E5A0' : rate>=40 ? '#FFB020' : '#FF3B5C';
  document.getElementById('gaugePct').textContent = rate + '%';

  const streak = computeStreak();
  const streakEl = document.getElementById('streakNum');
  streakEl.textContent = streak;
  streakEl.classList.toggle('zero', streak===0 && total>0);
  document.getElementById('bestStreak').textContent = computeBestStreak();
}

function renderHeatmap(){
  const map = document.getElementById('heatmap');
  map.innerHTML = '';
  const byDate = {};
  state.entries.forEach(e=>{
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  const days = 84;
  const today = new Date();
  today.setHours(0,0,0,0);
  const start = new Date(today);
  start.setDate(start.getDate() - days + 1);
  const startDow = start.getDay();
  start.setDate(start.getDate() - startDow);

  const totalDays = days + startDow;
  const weeks = Math.ceil(totalDays/7);

  for(let w=0; w<weeks; w++){
    const col = document.createElement('div');
    col.className = 'heat-col';
    for(let d=0; d<7; d++){
      const cellDate = new Date(start);
      cellDate.setDate(start.getDate() + w*7 + d);
      const key = cellDate.toISOString().slice(0,10);
      const cell = document.createElement('div');
      cell.className = 'heat-cell';
      if(cellDate <= today){
        const dayEntries = byDate[key];
        if(dayEntries && dayEntries.length){
          const allOk = dayEntries.every(e=>e.disciplined);
          const anyOk = dayEntries.some(e=>e.disciplined);
          cell.classList.add(allOk ? 'd-ok' : (anyOk ? 'd-partial' : 'd-bad'));
        }
      } else {
        cell.style.opacity = '0';
      }
      col.appendChild(cell);
    }
    map.appendChild(col);
  }
  document.getElementById('heatCount').textContent = state.entries.length + ' entries';
}

function renderHistory(){
  const wrap = document.getElementById('historyList');
  document.getElementById('histCount').textContent = state.entries.length;
  if(state.entries.length===0){
    wrap.innerHTML = '<div class="empty">// KEINE EINTRÄGE — LEG LOS</div>';
    return;
  }
  wrap.innerHTML = '';
  const phaseLabels = {eval1:'EVAL P1', eval2:'EVAL P2', funded:'FUNDED'};
  state.entries.slice(0,50).forEach(e=>{
    const div = document.createElement('div');
    div.className = 'entry ' + (e.disciplined ? 'e-ok' : 'e-bad');
    const resultLabel = {win:'WIN', loss:'LOSS', be:'BE', none:'NO TRADE'}[e.result] || e.result;
    const phaseLabel = phaseLabels[e.phase] || '';
    div.innerHTML = `
      <div class="entry-top">
        <span class="entry-date">${isoToDE(e.date)} · ${resultLabel}</span>
        <span style="display:flex; gap:5px;">
          ${phaseLabel ? `<span class="pill phase">${phaseLabel}</span>` : ''}
          <span class="pill ${e.disciplined?'ok':'bad'}">${e.disciplined?'CLEAN':'VIOLATION'}</span>
        </span>
      </div>
      ${e.brokenRules.length ? `<div class="entry-violations">✕ ${e.brokenRules.map(escapeHtml).join(', ')}</div>` : ''}
      ${e.note ? `<div class="entry-note">"${escapeHtml(e.note)}"</div>` : ''}
    `;
    wrap.appendChild(div);
  });
}

function renderStatsPage(){
  const counts = {};
  state.entries.forEach(e=> e.brokenRules.forEach(r=> counts[r]=(counts[r]||0)+1));
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const maxCount = sorted.length ? sorted[0][1] : 1;
  const vb = document.getElementById('violationBreakdown');
  vb.innerHTML = sorted.length===0
    ? '<div class="empty">// NOCH KEINE VERSTÖSSE</div>'
    : sorted.map(([rule,count])=>`
        <div class="vbar-row">
          <div class="vbar-top"><span>${escapeHtml(rule)}</span><span class="cnt">${count}×</span></div>
          <div class="vbar-track"><div class="vbar-fill" style="width:${(count/maxCount*100)}%"></div></div>
        </div>`).join('');

  const discWin = state.entries.filter(e=>e.disciplined && e.result==='win').length;
  const discLoss = state.entries.filter(e=>e.disciplined && e.result==='loss').length;
  const undiscWin = state.entries.filter(e=>!e.disciplined && e.result==='win').length;
  const undiscLoss = state.entries.filter(e=>!e.disciplined && e.result==='loss').length;
  document.getElementById('crossTab').innerHTML = `
    <div class="xtab-cell c-ok"><div class="n">${discWin}</div><div class="l">Clean → Win</div></div>
    <div class="xtab-cell"><div class="n">${discLoss}</div><div class="l">Clean → Loss</div></div>
    <div class="xtab-cell c-warn"><div class="n">${undiscWin}</div><div class="l">Verstoß → Win</div></div>
    <div class="xtab-cell c-bad"><div class="n">${undiscLoss}</div><div class="l">Verstoß → Loss</div></div>
  `;

  const phaseLabels = {eval1:'Eval Phase 1', eval2:'Eval Phase 2', funded:'Funded'};
  const phaseStats = {};
  ['eval1','eval2','funded'].forEach(p=> phaseStats[p] = {total:0, disciplined:0});
  state.entries.forEach(e=>{
    const p = e.phase || 'eval1';
    if(!phaseStats[p]) phaseStats[p] = {total:0, disciplined:0};
    phaseStats[p].total++;
    if(e.disciplined) phaseStats[p].disciplined++;
  });
  const pb = document.getElementById('phaseBreakdown');
  const phaseEntries = Object.entries(phaseStats).filter(([,s])=>s.total>0);
  pb.innerHTML = phaseEntries.length===0
    ? '<div class="empty">// NOCH KEINE PHASEN-DATEN</div>'
    : phaseEntries.map(([p,s])=>{
        const rate = s.total ? Math.round(s.disciplined/s.total*100) : 0;
        return `
        <div class="vbar-row">
          <div class="vbar-top"><span>${phaseLabels[p]||p}</span><span class="cnt" style="color:${rate>=70?'var(--ok)':rate>=40?'var(--warn)':'var(--bad)'}">${rate}% · ${s.total} Einträge</span></div>
          <div class="vbar-track"><div class="vbar-fill" style="width:${rate}%; background:${rate>=70?'linear-gradient(90deg,var(--ok),#5eead4)':rate>=40?'linear-gradient(90deg,var(--warn),#ffd280)':'linear-gradient(90deg,var(--bad),#ff7a92)'}"></div></div>
        </div>`;
      }).join('');

  const wdCounts = [0,0,0,0,0,0,0];
  const wdTotal = [0,0,0,0,0,0,0];
  state.entries.forEach(e=>{
    const d = new Date(e.date + 'T00:00:00');
    if(isNaN(d)) return;
    const dow = d.getDay();
    wdTotal[dow]++;
    if(!e.disciplined) wdCounts[dow]++;
  });
  const wb = document.getElementById('weekdayBreakdown');
  const maxWd = Math.max(1, ...wdCounts);
  wb.innerHTML = WEEKDAYS_DE.map((name,i)=>`
    <div class="vbar-row">
      <div class="vbar-top"><span>${name}</span><span class="cnt">${wdCounts[i]}/${wdTotal[i]}</span></div>
      <div class="vbar-track"><div class="vbar-fill" style="width:${(wdCounts[i]/maxWd*100)}%"></div></div>
    </div>`).join('');
}

function renderTicker(){
  const total = state.entries.length;
  const disciplinedCount = state.entries.filter(e=>e.disciplined).length;
  const rate = total ? Math.round(disciplinedCount/total*100) : 0;
  const streak = computeStreak();
  const best = computeBestStreak();
  const violations = state.entries.filter(e=>!e.disciplined).length;
  const items = [
    `<span><b>${rate}%</b> DISCIPLINE RATE</span>`,
    `<span class="${streak===0 && total>0 ? 'neg':''}"><b>${streak}</b> CURRENT STREAK</span>`,
    `<span><b>${best}</b> BEST STREAK</span>`,
    `<span class="${violations>0?'neg':''}"><b>${violations}</b> TOTAL VIOLATIONS</span>`,
    `<span><b>${total}</b> LOGGED ENTRIES</span>`,
    `<span><b>${state.rules.length}</b> ACTIVE RULES</span>`,
  ];
  document.getElementById('tickerInner').innerHTML = items.join('') + items.join('');
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'discipline-tracker-backup.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.rules && data.entries){ state = data; saveState(); renderAll(); alert('Backup importiert.'); }
    }catch(err){ alert('Ungültige Datei.'); }
  };
  reader.readAsText(file);
}

function renderAll(){
  renderHeaderDate();
  renderRules();
  renderCheckList();
  renderGaugeAndStreak();
  renderHeatmap();
  renderHistory();
  renderStatsPage();
  renderTicker();
}

document.getElementById('entryDate').value = todayDE();
if(state.lastPhase) document.getElementById('entryPhase').value = state.lastPhase;
renderAll();
</script>
</body>
</html>
